name: Deploy Storybook to PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (for testing)'
        required: true
        type: string

env:
  AWS_DEFAULT_REGION: ap-northeast-1

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview')
      )
    # 削除ジョブと共通のグループで、同じPRの実行中のプレビュー操作をキャンセルする
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build-storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.STG_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-PR-${{ env.PR_NUMBER }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Deploy to S3
        run: |
          # PR番号ごとのディレクトリにデプロイ
          aws s3 sync --delete \
            storybook-static s3://${{ secrets.STG_BUCKET_NAME }}/dads/html/pr-${{ env.PR_NUMBER }}/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STG_CF_DIST_ID }} \
            --paths "/dads/html/pr-${{ env.PR_NUMBER }}/*"

      - name: Get CloudFront Domain
        id: get_domain
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.STG_CF_DIST_ID }} \
            --query 'Distribution.DomainName' \
            --output text)
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ env.PR_NUMBER }};
            const domain = '${{ steps.get_domain.outputs.domain }}';
            const previewUrl = `https://${domain}/dads/html/pr-${prNumber}/`;

            // 既存のコメントを検索
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Environment')
            );

            const commentBody = [
              '## 🚀 Preview Environment',
              '',
              'Your PR preview is ready!',
              '',
              `🔗 **Preview URL**: ${previewUrl}`,
              '',
              '---',
              '',
              '| Status | Details |',
              '|--------|---------|',
              '| ✅ Build | Successfully completed |',
              `| 📦 Deployed | \`pr-${prNumber}/\` |`,
              `| 🕐 Last Updated | ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })} JST |`,
              '',
              '> Note: This preview environment will be automatically deleted when the PR is closed.'
            ].join('\n');

            if (botComment) {
              // 既存コメントを更新
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // 新規コメントを作成
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

      - name: Output summary for manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          DOMAIN="${{ steps.get_domain.outputs.domain }}"
          {
            echo "## 🚀 Preview Environment Deployed"
            echo ""
            echo "**Preview URL**: https://$DOMAIN/dads/html/pr-${{ env.PR_NUMBER }}/"
            echo ""
            echo "| Status | Details |"
            echo "|--------|---------|"
            echo "| ✅ Build | Successfully completed |"
            echo "| 📦 Deployed | \`pr-${{ env.PR_NUMBER }}/\` |"
            echo "| 🕐 Deployed At | $(date '+%Y-%m-%d %H:%M:%S') JST |"
          } >> "$GITHUB_STEP_SUMMARY"
