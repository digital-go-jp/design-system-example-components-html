<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無効状態｜テキストエリア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global.css">
<link rel="stylesheet" href="../form-control-label/form-control-label.css">
<link rel="stylesheet" href="textarea.css">
</head>
<body>

<div class="dads-form-control-label" data-size="md">
  <label class="dads-form-control-label__label" for="disabled-textarea">
    ラベル
    <span class="dads-form-control-label__status">無効</span>
  </label>
  <p id="disabled-support-text" class="dads-form-control-label__support-text">サポートテキスト</p>
  <div class="dads-form-control-label__field">
    <span class="dads-textarea">
      <textarea id="disabled-textarea" class="dads-textarea__textarea" disabled aria-describedby="disabled-support-text"></textarea>
    </span>
  </div>
</div>

</body>
</html>
