<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Separated（分割型）｜日付ピッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global.css">
<link rel="stylesheet" href="date-picker.css">
<script type="module" src="date-picker.js"></script>
</head>
<body>

<dads-date-picker class="dads-date-picker" data-type="separated">
  <div class="dads-date-picker__controls" data-size="md">
    <div class="dads-date-picker__separated-inputs">
      <label class="dads-date-picker__separated-year">
        <span class="dads-date-picker__separated-label">年</span>
        <input class="dads-date-picker__separated-input" type="text" inputmode="numeric" pattern="[0-9]+" data-js-year-input>
      </label>
      <label class="dads-date-picker__separated-month">
        <span class="dads-date-picker__separated-label">月</span>
        <input class="dads-date-picker__separated-input" type="text" inputmode="numeric" pattern="[0-9]+" data-js-month-input>
      </label>
      <label class="dads-date-picker__separated-day">
        <span class="dads-date-picker__separated-label">日</span>
        <input class="dads-date-picker__separated-input" type="text" inputmode="numeric" pattern="[0-9]+" data-js-day-input>
      </label>
    </div>
  </div>
</dads-date-picker>

</body>
</html>
