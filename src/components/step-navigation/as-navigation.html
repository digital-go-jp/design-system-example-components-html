<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リンク付き（ナビゲーションとして使用）｜ステップナビゲーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global.css">
<link rel="stylesheet" href="./step-navigation.css">
</head>
<body>

<nav class="dads-step-navigation" data-orientation="horizontal" data-size="normal" aria-label="ステップ">
  <p class="dads-u-visually-hidden">全3ステップ中、2ステップ目まで到達済み</p>
  <ul>
    <li class="dads-step-navigation__step" data-state="completed" data-first>
      <a class="dads-step-navigation__header" href="#">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">
          1
          <span class="dads-step-navigation__state-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="12" fill="#666"/>
              <path d="M10 17.5 19.8 8l-1.5-1.5-8.1 8-4.1-4L4.5 12l5.6 5.5Z" fill="#fff"/>
            </svg>
          </span>
          <span class="dads-u-visually-hidden">完了</span>
        </span>
        <span class="dads-step-navigation__title">ステップのタイトル</span>
      </a>
    </li>
    <li class="dads-step-navigation__step" data-state="reached" aria-current="true">
      <a class="dads-step-navigation__header" href="#">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">2</span>
        <span class="dads-step-navigation__title">ステップのタイトル</span>
      </a>
    </li>
    <li class="dads-step-navigation__step" data-last>
      <span class="dads-step-navigation__header">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">3</span>
        <span class="dads-step-navigation__title">ステップのタイトル</span>
      </span>
    </li>
  </ul>
</nav>

</body>
</html>
