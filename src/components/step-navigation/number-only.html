<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番号のみで使用する｜ステップナビゲーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global.css">
<link rel="stylesheet" href="./step-navigation.css">
</head>
<body>

<div class="dads-step-navigation" data-orientation="horizontal" data-size="normal">
  <p class="dads-u-visually-hidden">全3ステップ中、1ステップ目まで到達済み</p>
  <ul>
    <li class="dads-step-navigation__step" data-state="reached" data-first aria-current="true">
      <span class="dads-step-navigation__header">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">1</span>
      </span>
    </li>
    <li class="dads-step-navigation__step">
      <span class="dads-step-navigation__header">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">2</span>
      </span>
    </li>
    <li class="dads-step-navigation__step" data-last>
      <span class="dads-step-navigation__header">
        <span class="dads-u-visually-hidden">ステップ</span>
        <span class="dads-step-navigation__number">3</span>
      </span>
    </li>
  </ul>
</div>

</body>
</html>
